[package]
name = "dxpdf"
version = "0.4.0"
edition = "2021"
description = "A fast DOCX-to-PDF converter powered by Skia"
license = "MIT"
repository = "https://github.com/nerdy-pro/dxpdf"
homepage = "https://nerdy.pro"
documentation = "https://docs.rs/dxpdf"
readme = "README.md"
keywords = ["docx", "pdf", "converter", "word", "ooxml"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["test-cases/", "test-files/", "scripts/", "output/", "plans/"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bitflags = "2"
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
skia-safe = { version = "0.93", features = ["embed-freetype", "textlayout"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
# `abi3-py38` builds against Python's stable ABI (PEP 384), so a single wheel
# per (os, arch) works on Python 3.8 and every newer release without rebuilding.
# Without it, maturin emits CPython-version-locked wheels (`cp311`, `cp312`),
# forcing pip to fall back to source-build sdist on any unmatched Python —
# which then fails on hosts missing the freetype/fontconfig dev headers.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"], optional = true }
fontcull = { version = "2", optional = true }
# General OpenType libraries (fontations, republished under these names) — not
# `fontcull` itself, which stays behind `subset-fonts` below. Baking a variable
# instance's coordinates into embedded PDF bytes (issue #113) has to work
# whether or not that feature is on, since the wrong-outline bug it fixes isn't
# a subsetting defect: it's in what byte blob backs the `Typeface` used to
# draw, which Skia's PDF backend embeds regardless of subsetting. Both are
# already in the dependency tree today as `fontcull`'s own transitive deps;
# this only changes which line pulls them in.
fontcull-skrifa = "0.39"
fontcull-write-fonts = "0.44"
fontcull-read-fonts = "0.38"
fontcull-font-types = "0.10"
kurbo = "0.12"
unicode-segmentation = "1.13.2"
unicode-properties = "0.1.4"
unicode-normalization = "0.1.25"
# FxHash: a fast, non-cryptographic hasher for the per-render measurement memo
# (hot path, short keys). std's SipHash made an earlier width cache net-negative
# on small docs; FxHash keeps the probe cheap enough to win across the doc mix.
rustc-hash = "2"
# ICU4X (issue #124/#127): locale data ships as a committed blob
# (`src/i18n/data/icu_data.blob`, regenerated by `scripts/make_icu_data.sh`)
# loaded through `icu_provider_blob`, not through each crate's own default
# `compiled_data` feature — that feature bakes in every CLDR locale, which is
# the wheel-size risk #124 names by name. Every `icu_*` leaf crate that ships
# actual locale data (`icu_decimal`, `icu_datetime`, `icu_segmenter`) must be
# added with `default-features = false` for the trimmed blob to actually save
# anything instead of shipping both.
# `icu_locale_core`/`icu_provider`/`fixed_decimal` carry no `compiled_data`
# feature to begin with — they're plumbing/type crates, not locale data.
#
# Feature spellings differ per crate and are not interchangeable: `icu_decimal`
# and `icu_calendar` each have their own `alloc` feature, `icu_datetime` and
# `icu_segmenter` have none at all (their deps hard-wire `alloc` themselves, so
# naming it here is an unknown-feature error). Both date crates also default to
# `ixdtf` (IXDTF string parsing), which nothing here uses —
# `default-features = false` drops it along with `compiled_data`.
icu_locale_core = "2.2.0"
icu_provider = "2.2.0"
fixed_decimal = "0.7.2"
icu_provider_blob = { version = "2.2.0", default-features = false, features = ["alloc"] }
icu_decimal = { version = "2.2.0", default-features = false, features = ["alloc", "serde"] }
# §17.16.4.2 date-picture month/weekday names (issue #129). `icu_calendar` is
# not only `icu_datetime`'s input type: `src/field/now.rs` uses its `RataDie`
# arithmetic to turn a Unix timestamp into a Gregorian date rather than
# hand-rolling leap-year math.
icu_calendar = { version = "2.2.1", default-features = false, features = ["alloc", "serde"] }
icu_datetime = { version = "2.2.0", default-features = false, features = ["serde"] }
writeable = "0.6.3"
# UAX #14 line breaking (issue #130). `auto` is the feature that turns on the
# LSTM models for the four scripts UAX #14 leaves to "complex context analysis"
# (class SA — Thai, Lao, Khmer, Burmese); without it those scripts get no word
# boundaries at all and break mid-word. CJK needs no model — UAX #14's own
# rules handle class ID — so this is the whole of the complex-script cost.
icu_segmenter = { version = "2.2.0", default-features = false, features = ["auto", "serde"] }

[features]
default = ["subset-fonts"]
python = ["pyo3"]
# `fontcull` (Google's klippa packaged for Rust) produces a *complete* subsetted
# SFNT — cmap, hhea, OS/2 preserved — so Skia can shape against it normally
# during paint. The earlier `subsetter` (Typst) crate strips cmap by design,
# which broke Skia's draw_str path: every codepoint mapped to .notdef.
subset-fonts = ["dep:fontcull"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
lopdf = { version = "0.40", default-features = false }

[[bench]]
name = "convert_bench"
harness = false

[[bench]]
name = "parse_bench"
harness = false
